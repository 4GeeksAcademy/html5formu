<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 FORM</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <div class="row justify-content-center mt-5">
        <div class="col-md-10 offset-md-1">
            <div class="card">
                <div class="card-header">
                    <h3>Payment form example</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" role="alert">
                        Some fields are missing
                    </div>
                    <div class="row">
                        <div class="col-sm-5 pb-3">
                            <label for="card-number" class="form-label">Card #</label>
                            <input type="number" class="form-control" id="card-number" placeholder="XXXXXXXXXXXXXXXX">
                        </div>
                        <div class="col-sm-3 pb-3">
                            <label for="card-cvc" class="form-label">CVC #</label>
                            <input type="number" class="form-control" id="card-cvc" placeholder="0000">
                        </div>
                        <div class="col-sm-4 pb-3">
                            <label for="card-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="card-amount" placeholder="Amount">
                        </div> 
                    </div>
                    <div class="row">
                        <div class="col">
                            <label for="first-name" class="form-label">First Name</label>
                            <input id="first-name" type="text" class="form-control" aria-label="First name">
                        </div>
                        <div class="col">
                            <label for="last-name" class="form-label">Last Name</label>
                            <input id="last-name" type="text" class="form-control" aria-label="Last name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-6 pb-3">
                            <label for="card-city" class="form-label">City</label>
                            <input type="text" class="form-control" id="card-city">
                        </div>
                        <div class="col-sm-3 pb-3">
                            <label for="card-state" class="form-label">State</label>
                            <select id="card-state" class="form-select" aria-label="Default select example">
                                <option selected>Pick a state</option>
                                <option value="1">One</option>
                                <option value="2">Two</option>
                                <option value="3">Three</option>
                            </select>
                        </div>
                        <div class="col-sm-3 pb-3">
                            <label for="card-postal" class="form-label">Postal Code</label>
                            <input type="number" class="form-control" id="card-postal">
                        </div> 
                    </div>
                    <div class="row">
                        <div class="col-md-6 pb-3">
                            <p for="exampleAccount">We accept:</p>
                            <div class="btn-group" data-toggle="buttons">
                                <label class="btn btn-secondary">
                                    <input autocomplete="off" checked id="blue" name="options" type="radio">
                                    <i class="fab fa-cc-mastercard"></i>
                                </label> 
                                <label class="btn btn-secondary">
                                    <input autocomplete="off" id="red" name="options" type="radio">
                                    <i class="fab fa-cc-visa"></i>
                                </label> 
                                <label class="btn btn-secondary">
                                    <input autocomplete="off" id="green" name="options" type="radio">
                                    <i class="fab fa-cc-diners-club"></i>
                                </label> 
                                <label class="btn btn-secondary">
                                    <input autocomplete="off" id="yellow" name="options" type="radio">
                                    <i class="fab fa-cc-amex"></i>
                                </label> 
                            </div>
                        </div>
                        <div id="messege-section" class="col-md-6 pb-3">
                            <label for="exampleFormControlTextarea1" class="form-label">Message</label>
                            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                            <small class="text-muted">Add any notes here.</small>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="float-end">
                        <button type="button" class="btn btn-secondary">Cancel</button>
                        <button type="button" class="btn btn-primary">Send</button>
                    </div>
                </div>     
            </div>
        </div>
    </div>
</body>
</html>
